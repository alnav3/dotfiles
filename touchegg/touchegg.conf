<?xml version="1.0"?>
<!--
  touchegg config for surface-secure. Filters gestures to kodi ONLY,
  so hyprland and gamescope are unaffected. Kodi's window class is
  typically "kodi-standalone" under X11/GBM, but touchegg matches
  by `name=` which is the application/windowclass hint kodi exposes.

  Gesture mapping (kodi's standard keymap):
    1-finger swipe up      -> Up        (move to row above)
    1-finger swipe down    -> Down      (move to row below)
    1-finger swipe left    -> Left      (move within row)
    1-finger swipe right   -> Right     (move within row)
    1-finger swipe left    with thumb up -> PageUp
    1-finger swipe right   with thumb up -> PageDown
    2-finger swipe up      -> PageUp    (jump a screen)
    2-finger swipe down    -> PageDown
    1-finger tap           -> Return    (Enter)
    1-finger double tap    -> Return    (Enter, more reliable)
    2-finger tap           -> space     (Play/Pause in fullscreen)
    1-finger long press    -> i         (Info / context menu in kodi)

  Notes on the application filter:
    touchegg reads the focused window's class/wm_class. Kodi sets
    its class to "kodi-standalone" (or "kodi-gbm" depending on
    version). We match either via the regex.

  Hyprland's own touch handling (workspace gestures, etc.) is
  unaffected because its window class is "Hyprland" or whatever
  the app's class is — neither matches kodi's class.
-->
<touchégg>
  <settings>
    <daemon>true</daemon>
    <start_listening_mode>default</start_listening_mode>
    <animation_delay_factor>1.0</animation_delay_factor>
  </settings>

  <application name="(kodi-standalone|kodi-gbm|Kodi|kodi)">
    <gesture type="swipe" direction="up" fingers="1">
      <action type="keypress">Up</action>
    </gesture>
    <gesture type="swipe" direction="down" fingers="1">
      <action type="keypress">Down</action>
    </gesture>
    <gesture type="swipe" direction="left" fingers="1">
      <action type="keypress">Left</action>
    </gesture>
    <gesture type="swipe" direction="right" fingers="1">
      <action type="keypress">Right</action>
    </gesture>

    <gesture type="swipe" direction="up" fingers="2">
      <action type="keypress">PageUp</action>
    </gesture>
    <gesture type="swipe" direction="down" fingers="2">
      <action type="keypress">PageDown</action>
    </gesture>

    <gesture type="tap" fingers="1">
      <action type="keypress">Return</action>
    </gesture>

    <gesture type="doubleTap" fingers="1">
      <action type="keypress">Return</action>
    </gesture>

    <gesture type="doubleTap" fingers="2">
      <action type="keypress">space</action>
    </gesture>

    <gesture type="hold" fingers="1">
      <action type="keypress">i</action>
    </gesture>
  </application>
</touchégg>
